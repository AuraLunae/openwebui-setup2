# ==============================================================
# Open WebUI + SearXNG + Browserless ローカル構築
#
# 構成:
#   - 生成モデル : Qwen3 8B (Ollama経由 / ホストOS側で実行)
#   - Embedding  : Ruri base (Ollama経由)
#   - リランカー : 日本語 CrossEncoder (Open WebUI内部で実行)
#   - Web検索    : SearXNG (同一Composeネットワーク内)
#   - スクレイピング: Browserless (Headless Chrome / 同一Composeネットワーク内)
#
# 起動:
#   docker compose up -d
# ==============================================================

services:
  openwebui:
    container_name: openwebui_host
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      # --- ログ設定 ---
      GLOBAL_LOG_LEVEL: "info"
      SRC_LOG_LEVELS: '{"RAG": "DEBUG", "MAIN": "DEBUG", "OLLAMA": "DEBUG", "TOOLS": "DEBUG", "MODELS": "DEBUG", "WEBHOOK": "WARNING", "AUDIT": "WARNING", "DB": "WARNING", "SOCKET": "WARNING"}'

      # --- ホストOSのOllamaへの接続 ---
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

      # --- Web検索設定（新名称） ---
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: 6
      WEB_SEARCH_CONCURRENT_REQUESTS: 10
      ENABLE_SEARCH_QUERY_GENERATION: "true"
      ENABLE_WEB_LOADER_SSL_VERIFICATION: "true"
      WEB_LOADER_ENGINE: "safe_web"

      # --- Web検索設定（旧名称 / 互換性維持用） ---
      ENABLE_RAG_WEB_SEARCH: "true"
      RAG_WEB_SEARCH_ENGINE: "searxng"
      RAG_WEB_SEARCH_RESULT_COUNT: 6
      RAG_WEB_SEARCH_CONCURRENT_REQUESTS: 10
      ENABLE_RAG_LOCAL_WEB_FETCH: "true"

      # --- SearXNGの接続先 ---
      SEARXNG_QUERY_URL: "http://searxng:8080/search?lang=ja&q=<query>"

      # --- Embedding設定 ---
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_EMBEDDING_MODEL: "kun432/cl-nagoya-ruri-base:latest"
      RAG_EMBEDDING_BATCH_SIZE: 1
      RAG_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 50

      # --- リランカー設定 ---
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_RERANKING_MODEL: "hotchpotch/japanese-reranker-cross-encoder-large-v1"
      RAG_TOP_K: 3
      RAG_RELEVANCE_THRESHOLD: 0.0

      # --- 日本語検索クエリ生成プロンプト ---
      QUERY_GENERATION_PROMPT_TEMPLATE: |-
        ### Task:
        Analyze the chat history to determine the necessity of generating search queries, in the given language. By default, **prioritize generating 1-3 broad and relevant search queries** unless it is absolutely certain that no additional information is required. The aim is to retrieve comprehensive, updated, and valuable information even with minimal uncertainty. If no search is unequivocally needed, return an empty list.

        ### Guidelines:
        - クエリは必ず **日本語** にしてください
        - Respond **EXCLUSIVELY** with a JSON object. Any form of extra commentary, explanation, or additional text is strictly prohibited.
        - When generating search queries, respond in the format: { "queries": ["クエリ1", "クエリ2"] }, ensuring each query is distinct, concise, and relevant to the topic.
        - If and only if it is entirely certain that no useful results can be retrieved by a search, return: { "queries": [] }.
        - Err on the side of suggesting search queries if there is **any chance** they might provide useful or updated information.
        - Be concise and focused on composing high-quality search queries, avoiding unnecessary elaboration, commentary, or assumptions.
        - Today's date is: {{CURRENT_DATE}}.
        - Always prioritize providing actionable and broad queries that maximize informational coverage.

        ### Output:
        Strictly return in JSON format:
        {
          "queries": ["クエリ1", "クエリ2"]
        }

        ### Chat History:
        <chat_history>
        {{MESSAGES:END:6}}
        </chat_history>
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
      - browserless

  searxng:
    container_name: searxng_host
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    env_file:
      - .env
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # --- 追加: カスタムスクリプトが呼び出す Browserless コンテナ ---
  browserless:
    container_name: browserless_host
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    environment:
      - CONCURRENCY=10
      - TIMEOUT=10000

volumes:
  open-webui: