# ==============================================================
# Open WebUI + SearXNG + Open Terminal ローカル構築（Windows / RTX 4050 向け）
#
# 構成:
#   - 生成モデル : Qwen3 8B (Ollama経由 / ホストOS側で実行)
#   - Embedding  : Ruri base (Ollama経由)
#   - リランカー : 日本語 CrossEncoder (Open WebUI内部で実行)
#   - Web検索    : SearXNG (同一Composeネットワーク内のコンテナ)
#   - サンドボックス : Open Terminal (Ubuntu 22.04 + API 一体型コンテナ) 【追加】
#
# 事前にホストOS側で実行しておくこと:
#   ollama pull qwen3:8b
#   ollama pull kun432/cl-nagoya-ruri-base
#
# 起動:
#   docker compose up -d
# ==============================================================

services:
  openwebui:
    container_name: openwebui_host
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      # 問題の切り分けが済んだらこの行は削除してよい（ログが大量に出るため）
      GLOBAL_LOG_LEVEL: "info"

      # ==========================================================
      # デバッグ用: モジュール別ログレベル
      # 検索・RAG・Ollama周りだけDEBUGにして、それ以外は静かにする。
      # 不要になったらこのブロックごと削除、またはコメントアウトでよい。
      # ==========================================================
      SRC_LOG_LEVELS: '{"RAG": "DEBUG", "MAIN": "DEBUG", "OLLAMA": "DEBUG", "TOOLS": "DEBUG", "MODELS": "DEBUG", "WEBHOOK": "WARNING", "AUDIT": "WARNING", "DB": "WARNING", "SOCKET": "WARNING"}'

      # --- ホストOSのOllamaへの接続 ---
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

      # ==========================================================
      # Open Terminal（AI用Ubuntuサンドボックス）の接続設定 【追加】
      # ==========================================================
      ENABLE_OPEN_TERMINAL: "true"
      OPEN_TERMINAL_URL: "http://open-terminal:8000"
      OPEN_TERMINAL_API_KEY: "your_secret_terminal_key"

      # ==========================================================
      # Web検索の有効化【新名称】
      # ※ 2025年以降のOpen WebUIはこちらを参照する。
      #    旧名称(RAG_接頭辞)だけだと検索処理が起動しないので必須。
      # ==========================================================
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: 6
      WEB_SEARCH_CONCURRENT_REQUESTS: 10
      ENABLE_SEARCH_QUERY_GENERATION: "true"
      ENABLE_WEB_LOADER_SSL_VERIFICATION: "true"
      WEB_LOADER_ENGINE: "safe_web"

      # --- 旧名称（古いバージョン向けの後方互換として併記）---
      ENABLE_RAG_WEB_SEARCH: "true"
      RAG_WEB_SEARCH_ENGINE: "searxng"
      RAG_WEB_SEARCH_RESULT_COUNT: 6
      RAG_WEB_SEARCH_CONCURRENT_REQUESTS: 10
      ENABLE_RAG_LOCAL_WEB_FETCH: "true"

      # --- SearXNGの接続先 ---
      # コンテナ名 searxng で名前解決される（同一Composeネットワーク内）
      SEARXNG_QUERY_URL: "http://searxng:8080/search?lang=ja&q=<query>"

      # ==========================================================
      # Embedding（Ruri v3 / Hugging Faceから直接ロード）
      # RAG_EMBEDDING_ENGINEをollamaにせず空にしておくと、Open WebUI自身が
      # sentence-transformers経由でHugging Faceから直接ダウンロードして動く。
      # Ollamaへの登録は不要。
      # ==========================================================
      RAG_EMBEDDING_MODEL: "cl-nagoya/ruri-v3-310m"
      RAG_EMBEDDING_BATCH_SIZE: 8

      # Ruri v3は最大8192トークンまで対応（v1/v2の512トークンから大幅拡張）。
      # 記事のベンチマーク（Vecta 2026）に合わせてRecursive 512トークン相当に設定。
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 75

      # ==========================================================
      # リランカー（Ruri v3 reranker / Hugging Faceから直接ロード）
      # JQaRAベンチマークでnDCG@10=86.9と、旧SOTA(77.1)を大幅に上回る報告あり。
      # ==========================================================
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_RERANKING_MODEL: "cl-nagoya/ruri-v3-reranker-310m"
      RAG_TOP_K: 12
      RAG_TOP_K_RERANKER: 6
      RAG_RELEVANCE_THRESHOLD: 0.0

      # ==========================================================
      # 検索クエリを日本語で生成させるプロンプト
      # ==========================================================
      QUERY_GENERATION_PROMPT_TEMPLATE: |-
        ### Task:
        Analyze the chat history to determine the necessity of generating search queries, in the given language. By default, **prioritize generating 1-3 broad and relevant search queries** unless it is absolutely certain that no additional information is required. The aim is to retrieve comprehensive, updated, and valuable information even with minimal uncertainty. If no search is unequivocally needed, return an empty list.

        ### Guidelines:
        - クエリは必ず **日本語** にしてください
        - Respond **EXCLUSIVELY** with a JSON object. Any form of extra commentary, explanation, or additional text is strictly prohibited.
        - When generating search queries, respond in the format: { "queries": ["クエリ1", "クエリ2"] }, ensuring each query is distinct, concise, and relevant to the topic.
        - If and only if it is entirely certain that no useful results can be retrieved by a search, return: { "queries": [] }.
        - Err on the side of suggesting search queries if there is **any chance** they might provide useful or updated information.
        - Be concise and focused on composing high-quality search queries, avoiding unnecessary elaboration, commentary, or assumptions.
        - Today's date is: {{CURRENT_DATE}}.
        - Always prioritize providing actionable and broad queries that maximize informational coverage.

        ### Output:
        Strictly return in JSON format:
        {
          "queries": ["クエリ1", "クエリ2"]
        }

        ### Chat History:
        <chat_history>
        {{MESSAGES:END:6}}
        </chat_history>
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
      - crawl4ai
      - ruri-embedder
      - open-terminal # 【追加】

  # ==========================================================
  # Open Terminal（UbuntuベースのOS + API通信 一体型コンテナ）【追加】
  # ==========================================================
  open-terminal:
    container_name: open_terminal_host
    image: ghcr.io/open-webui/open-terminal:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=your_secret_terminal_key
    volumes:
      - open-terminal-workspace:/workspace

  # --- ページ本文取得・Markdown抽出（旧Browserlessから移行） ---
  crawl4ai:
    container_name: crawl4ai_host
    # 注意: :basic や :latest は 0.9.1 のブラウザ起動バグ(Issue #2064)を踏む可能性があるため
    # 0.9.0 に固定する。0.9.0未満はCVE-2026-57572（未認証RCE）の対象なので、
    # それより古いバージョンには絶対に戻さないこと。
    image: unclecode/crawl4ai:0.9.0
    restart: unless-stopped
    environment:
      # 未認証での踏み台悪用を防ぐため必須。任意の文字列に変更してください。
      - CRAWL4AI_API_TOKEN=your_secret_crawl4ai_token
    ports:
      - "11235:11235"
    volumes:
      - /dev/shm:/dev/shm
    shm_size: "1g"

  # --- カスタムWeb検索ツール専用のRuri v3 embeddingサーバー ---
  # 初回 `docker compose up` 時にビルドが走り、モデルのダウンロードも
  # 含めて数分かかる（ネットワーク速度に依存）。
  ruri-embedder:
    container_name: ruri_embedder_host
    build:
      context: ./ruri-embedder
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ruri-embedder-cache:/root/.cache/huggingface

  searxng:
    container_name: searxng_host
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    env_file:
      - .env
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  open-webui:
  ruri-embedder-cache:
  open-terminal-workspace: # 【追加】